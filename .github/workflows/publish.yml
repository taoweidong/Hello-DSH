name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to stage for publishing (e.g. v0.1.3)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Staged publishing needs npm >= 11.15.0 (node 22 bundles npm 10.x).
      - name: Upgrade npm for staged publishing
        run: npm install -g 'npm@^11.15.0'
      - name: Install dev dependencies
        run: npm ci
      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-version.mjs "$TAG"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Verify packed contents
        env:
          PACK_JSON: ${{ runner.temp }}/pack.json
        run: |
          npm pack --dry-run --json > "$PACK_JSON"
          node -e '
          const fs = require("node:fs");
          const [pack] = JSON.parse(fs.readFileSync(process.env.PACK_JSON, "utf8"));
          const files = new Set(pack.files.map((file) => file.path));
          const required = ["index.js", "workflows.js", "client.js", "web/index.html", "cordis.patch.yml", "icon.svg", "README.md", "LICENSE", "package.json"];
          const missing = required.filter((file) => !files.has(file));
          if (missing.length) throw new Error("missing from npm tarball: " + missing.join(", "));
          if (pack.entryCount !== 9) throw new Error("expected 9 packed files, got " + pack.entryCount);
          console.log("pack ok: " + pack.entryCount + " files, " + pack.size + " bytes packed, " + pack.unpackedSize + " bytes unpacked");
          '
      # Stage-only tokens cannot run `npm publish`; they may only stage.
      # A maintainer completes the release with 2FA: `npm stage approve <stage-id>`.
      - name: Stage for publishing
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
